<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="qrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  
  <rect width="200" height="200" rx="20" fill="#FFFFFF"/>
  
  <!-- Outer Corners Position Markers -->
  <!-- Top Left -->
  <rect x="20" y="20" width="45" height="45" rx="8" fill="url(#qrGrad)"/>
  <rect x="27" y="27" width="31" height="31" rx="4" fill="#FFFFFF"/>
  <rect x="34" y="34" width="17" height="17" rx="2" fill="url(#qrGrad)"/>

  <!-- Top Right -->
  <rect x="135" y="20" width="45" height="45" rx="8" fill="url(#qrGrad)"/>
  <rect x="142" y="27" width="31" height="31" rx="4" fill="#FFFFFF"/>
  <rect x="149" y="34" width="17" height="17" rx="2" fill="url(#qrGrad)"/>

  <!-- Bottom Left -->
  <rect x="20" y="135" width="45" height="45" rx="8" fill="url(#qrGrad)"/>
  <rect x="27" y="142" width="31" height="31" rx="4" fill="#FFFFFF"/>
  <rect x="34" y="149" width="17" height="17" rx="2" fill="url(#qrGrad)"/>

  <!-- QR Modules Pattern -->
  <g fill="url(#qrGrad)">
    <rect x="75" y="20" width="10" height="10" rx="2"/>
    <rect x="90" y="20" width="20" height="10" rx="2"/>
    <rect x="115" y="20" width="10" height="20" rx="2"/>
    <rect x="75" y="35" width="30" height="10" rx="2"/>
    <rect x="115" y="45" width="10" height="20" rx="2"/>
    
    <rect x="20" y="75" width="20" height="10" rx="2"/>
    <rect x="45" y="75" width="10" height="20" rx="2"/>
    <rect x="60" y="75" width="15" height="15" rx="2"/>
    <rect x="80" y="75" width="25" height="10" rx="2"/>
    <rect x="110" y="75" width="15" height="15" rx="2"/>
    <rect x="130" y="75" width="25" height="10" rx="2"/>
    <rect x="160" y="75" width="20" height="10" rx="2"/>

    <rect x="20" y="90" width="10" height="20" rx="2"/>
    <rect x="35" y="100" width="20" height="10" rx="2"/>
    <rect x="60" y="95" width="10" height="30" rx="2"/>
    <rect x="75" y="90" width="50" height="50" rx="10" fill="#0B0F19"/>
    
    <rect x="130" y="90" width="15" height="20" rx="2"/>
    <rect x="150" y="90" width="30" height="10" rx="2"/>
    <rect x="150" y="105" width="10" height="20" rx="2"/>

    <rect x="75" y="150" width="20" height="10" rx="2"/>
    <rect x="100" y="135" width="25" height="10" rx="2"/>
    <rect x="130" y="135" width="10" height="25" rx="2"/>
    <rect x="145" y="135" width="20" height="10" rx="2"/>
    <rect x="100" y="150" width="10" height="30" rx="2"/>
    <rect x="115" y="165" width="40" height="15" rx="2"/>
    <rect x="160" y="150" width="20" height="30" rx="2"/>
  </g>

  <!-- Center Logo Badge -->
  <rect x="83" y="98" width="34" height="34" rx="8" fill="url(#qrGrad)"/>
  <text x="100" y="121" font-family="sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle">Q1</text>
</svg>
