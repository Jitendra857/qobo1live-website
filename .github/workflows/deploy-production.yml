name: Deploy Qobo1live Landing Page - Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy Landing Page - Production
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # Checkout repository
      # ----------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------
      # Setup Node.js
      # ----------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ----------------------------------------
      # Install dependencies
      # ----------------------------------------
      - name: Install Dependencies
        run: npm ci

      # ----------------------------------------
      # Build Next.js static application
      #
      # next.config.ts must contain:
      #
      # output: "export"
      #
      # Next.js generates the static site in:
      # ./out
      # ----------------------------------------
      - name: Build Application
        run: npm run build

      # ----------------------------------------
      # Verify Next.js export
      # ----------------------------------------
      - name: Verify Build
        run: |
          echo "Checking landing page build..."

          if [ ! -f "out/index.html" ]; then
            echo "ERROR: out/index.html not found"
            echo "Build directory contents:"
            ls -lah
            exit 1
          fi

          echo "Landing page build successful."

          echo "Build contents:"
          ls -lah out

      # ----------------------------------------
      # Create deployment package
      # ----------------------------------------
      - name: Create Deployment Package
        run: |
          echo "Creating landing page deployment package..."

          tar -czf qobo1live-landing.tar.gz -C out .

          echo "Deployment package:"
          ls -lh qobo1live-landing.tar.gz

      # ----------------------------------------
      # Test VPS connectivity
      # ----------------------------------------
      - name: Test VPS SSH Connectivity
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          echo "Testing VPS connectivity..."

          timeout 15 bash -c \
            "</dev/tcp/${VPS_HOST}/22" \
            && echo "VPS port 22 is reachable" \
            || (
              echo "ERROR: VPS port 22 is NOT reachable"
              exit 1
            )

      # ----------------------------------------
      # Prepare SSH key
      # ----------------------------------------
      - name: Prepare SSH Key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e

          echo "Preparing SSH key..."

          if [ -z "$VPS_SSH_KEY" ]; then
            echo "ERROR: VPS_SSH_KEY secret is empty"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/qobo1live_deploy

          chmod 600 ~/.ssh/qobo1live_deploy

          echo "Validating SSH private key..."

          ssh-keygen -y \
            -f ~/.ssh/qobo1live_deploy \
            > /dev/null

          echo "SSH private key is valid."

      # ----------------------------------------
      # Configure known_hosts
      # ----------------------------------------
      - name: Configure SSH Known Hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -e

          echo "Adding VPS host to known_hosts..."

          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          chmod 644 ~/.ssh/known_hosts

          echo "known_hosts configured."

      # ----------------------------------------
      # Upload deployment package
      # ----------------------------------------
      - name: Upload Landing Page Package
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
        run: |
          set -e

          echo "Uploading landing page package..."

          scp \
            -i ~/.ssh/qobo1live_deploy \
            -P 22 \
            qobo1live-landing.tar.gz \
            "${VPS_USERNAME}@${VPS_HOST}:/tmp/qobo1live-landing.tar.gz"

          echo "Landing page package uploaded successfully."

      # ----------------------------------------
      # Deploy on VPS
      # ----------------------------------------
      - name: Deploy Landing Page on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
        run: |
          set -e

          echo "=========================================="
          echo "Starting Qobo1live Landing Page Deployment"
          echo "=========================================="

          ssh \
            -i ~/.ssh/qobo1live_deploy \
            -p 22 \
            "${VPS_USERNAME}@${VPS_HOST}" <<'REMOTE_SCRIPT'

          set -e

          echo "Connected to VPS successfully."

          # ----------------------------------------
          # Create deployment directories
          # ----------------------------------------
          echo "Creating deployment directories..."

          mkdir -p /var/www/qobo1live-landing/releases

          # ----------------------------------------
          # Generate release ID
          # ----------------------------------------
          RELEASE_ID=$(date +%Y%m%d%H%M%S)

          RELEASE_DIR="/var/www/qobo1live-landing/releases/$RELEASE_ID"

          echo "Release ID: $RELEASE_ID"
          echo "Release directory: $RELEASE_DIR"

          mkdir -p "$RELEASE_DIR"

          # ----------------------------------------
          # Verify uploaded package
          # ----------------------------------------
          echo "Checking uploaded package..."

          if [ ! -f "/tmp/qobo1live-landing.tar.gz" ]; then
            echo "ERROR: Deployment package not found!"
            exit 1
          fi

          ls -lh /tmp/qobo1live-landing.tar.gz

          # ----------------------------------------
          # Extract deployment
          # ----------------------------------------
          echo "Extracting landing page..."

          tar -xzf \
            /tmp/qobo1live-landing.tar.gz \
            -C "$RELEASE_DIR"

          # ----------------------------------------
          # Verify deployment
          # ----------------------------------------
          echo "Verifying deployed files..."

          if [ ! -f "$RELEASE_DIR/index.html" ]; then
            echo "ERROR: index.html not found after extraction!"

            echo "Release directory contents:"
            ls -lah "$RELEASE_DIR"

            exit 1
          fi

          echo "Landing page files:"
          ls -lah "$RELEASE_DIR"

          # ----------------------------------------
          # Set ownership
          # ----------------------------------------
          echo "Setting permissions..."

          chown -R www-data:www-data "$RELEASE_DIR"

          chmod -R 755 "$RELEASE_DIR"

          # ----------------------------------------
          # Update current release symlink
          # ----------------------------------------
          echo "Updating current release..."

          ln -sfn \
            "$RELEASE_DIR" \
            /var/www/qobo1live-landing/current

          # ----------------------------------------
          # Verify current release
          # ----------------------------------------
          echo "Current release:"

          readlink -f \
            /var/www/qobo1live-landing/current

          # ----------------------------------------
          # Remove uploaded package
          # ----------------------------------------
          echo "Removing deployment package..."

          rm -f /tmp/qobo1live-landing.tar.gz

          # ----------------------------------------
          # Keep latest 3 releases
          # ----------------------------------------
          echo "Cleaning old releases..."

          cd /var/www/qobo1live-landing/releases

          ls -1dt */ 2>/dev/null \
            | tail -n +4 \
            | xargs -r rm -rf

          # ----------------------------------------
          # Validate Nginx
          # ----------------------------------------
          echo "Testing Nginx configuration..."

          nginx -t

          # ----------------------------------------
          # Reload Nginx
          # ----------------------------------------
          echo "Reloading Nginx..."

          systemctl reload nginx

          # ----------------------------------------
          # Final verification
          # ----------------------------------------
          echo "=========================================="
          echo "Landing Page Deployment Completed"
          echo "=========================================="

          echo "Current release:"
          readlink -f /var/www/qobo1live-landing/current

          echo "=========================================="

          REMOTE_SCRIPT