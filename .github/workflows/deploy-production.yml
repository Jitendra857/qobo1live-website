name: Deploy Qobo1live Landing Page - Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy Landing Page
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # Checkout repository
      # ----------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------
      # Setup Node.js
      # ----------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ----------------------------------------
      # Install dependencies
      # ----------------------------------------
      - name: Install Dependencies
        run: npm ci

      # ----------------------------------------
      # Build Next.js static application
      #
      # next.config.ts:
      # output: "export"
      #
      # Next.js generates static files in /out
      # ----------------------------------------
      - name: Build Application
        run: npm run build

      # ----------------------------------------
      # Verify build
      # ----------------------------------------
      - name: Verify Build
        run: |
          set -e

          echo "=========================================="
          echo "Checking landing page build..."
          echo "=========================================="

          if [ ! -f "out/index.html" ]; then
            echo "ERROR: out/index.html not found"
            echo "Contents of project directory:"
            ls -lah
            echo ""
            echo "Contents of out directory, if present:"
            ls -lah out 2>/dev/null || true
            exit 1
          fi

          echo "Landing page build successful."

          echo ""
          echo "Build contents:"
          ls -lah out

      # ----------------------------------------
      # Create deployment package
      # ----------------------------------------
      - name: Create Deployment Package
        run: |
          set -e

          echo "Creating deployment package..."

          tar -czf qobo1live-landing.tar.gz -C out .

          echo "Deployment package created:"
          ls -lh qobo1live-landing.tar.gz

      # ----------------------------------------
      # Test VPS connectivity
      # ----------------------------------------
      - name: Test VPS SSH Connectivity
        run: |
          set -e

          echo "Testing VPS connectivity..."

          timeout 15 bash -c \
            '</dev/tcp/${{ secrets.VPS_HOST }}/22' \
            && echo "VPS port 22 is reachable from GitHub Runner" \
            || (
              echo "ERROR: VPS port 22 is NOT reachable from GitHub Runner"
              exit 1
            )

      # ----------------------------------------
      # Test SSH authentication
      #
      # IMPORTANT:
      # VPS_SSH_KEY must contain the complete
      # OpenSSH private key.
      # ----------------------------------------
      - name: Test VPS SSH Authentication
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22

          timeout: 30s
          command_timeout: 1m

          script: |
            set -e

            echo "=========================================="
            echo "SSH authentication successful"
            echo "=========================================="

            echo "Connected user:"
            whoami

            echo "Server:"
            hostname

      # ----------------------------------------
      # Upload deployment package
      # ----------------------------------------
      - name: Upload Landing Page
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22

          source: qobo1live-landing.tar.gz
          target: /tmp

          timeout: 30s
          command_timeout: 10m

          overwrite: true

      # ----------------------------------------
      # Deploy landing page on VPS
      # ----------------------------------------
      - name: Deploy Landing Page on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22

          timeout: 30s
          command_timeout: 10m

          script: |
            set -e

            echo "=========================================="
            echo "Starting Qobo1live Landing Page Deployment"
            echo "=========================================="

            # ----------------------------------------
            # Deployment root
            # ----------------------------------------
            DEPLOY_ROOT="/var/www/qobo1live-landing"
            RELEASES_DIR="$DEPLOY_ROOT/releases"
            CURRENT_LINK="$DEPLOY_ROOT/current"

            echo "Deployment root:"
            echo "$DEPLOY_ROOT"

            # ----------------------------------------
            # Create directories
            # ----------------------------------------
            echo "Creating deployment directories..."

            mkdir -p "$RELEASES_DIR"

            # ----------------------------------------
            # Generate release ID
            # ----------------------------------------
            RELEASE_ID=$(date +%Y%m%d%H%M%S)

            RELEASE_DIR="$RELEASES_DIR/$RELEASE_ID"

            echo "Release ID:"
            echo "$RELEASE_ID"

            echo "Release directory:"
            echo "$RELEASE_DIR"

            mkdir -p "$RELEASE_DIR"

            # ----------------------------------------
            # Verify uploaded package
            # ----------------------------------------
            echo "Checking uploaded package..."

            if [ ! -f "/tmp/qobo1live-landing.tar.gz" ]; then
              echo "ERROR: Deployment package not found!"
              exit 1
            fi

            ls -lh /tmp/qobo1live-landing.tar.gz

            # ----------------------------------------
            # Extract deployment
            # ----------------------------------------
            echo "Extracting landing page..."

            tar -xzf /tmp/qobo1live-landing.tar.gz \
              -C "$RELEASE_DIR"

            # ----------------------------------------
            # Verify deployment
            # ----------------------------------------
            echo "Verifying deployed files..."

            if [ ! -f "$RELEASE_DIR/index.html" ]; then
              echo "ERROR: index.html not found after extraction!"

              echo "Release contents:"
              ls -lah "$RELEASE_DIR"

              exit 1
            fi

            echo "Landing page deployment files:"
            ls -lah "$RELEASE_DIR"

            # ----------------------------------------
            # Set ownership
            # ----------------------------------------
            echo "Setting ownership..."

            chown -R www-data:www-data "$RELEASE_DIR"

            # ----------------------------------------
            # Set permissions
            # ----------------------------------------
            echo "Setting permissions..."

            find "$RELEASE_DIR" -type d -exec chmod 755 {} \;
            find "$RELEASE_DIR" -type f -exec chmod 644 {} \;

            # ----------------------------------------
            # Update current symlink
            # ----------------------------------------
            echo "Updating current symlink..."

            ln -sfn "$RELEASE_DIR" "$CURRENT_LINK"

            # ----------------------------------------
            # Verify current release
            # ----------------------------------------
            echo "Current release:"

            readlink -f "$CURRENT_LINK"

            if [ ! -f "$CURRENT_LINK/index.html" ]; then
              echo "ERROR: current/index.html does not exist!"
              exit 1
            fi

            # ----------------------------------------
            # Remove uploaded package
            # ----------------------------------------
            echo "Removing uploaded package..."

            rm -f /tmp/qobo1live-landing.tar.gz

            # ----------------------------------------
            # Keep latest 3 releases
            # ----------------------------------------
            echo "Cleaning old releases..."

            cd "$RELEASES_DIR"

            ls -1dt */ 2>/dev/null \
              | tail -n +4 \
              | xargs -r rm -rf

            # ----------------------------------------
            # Validate Nginx
            # ----------------------------------------
            echo "Testing Nginx configuration..."

            nginx -t

            # ----------------------------------------
            # Reload Nginx
            # ----------------------------------------
            echo "Reloading Nginx..."

            systemctl reload nginx

            # ----------------------------------------
            # Final verification
            # ----------------------------------------
            echo "=========================================="
            echo "Landing Page Deployment Completed"
            echo "=========================================="

            echo "Current release:"
            readlink -f "$CURRENT_LINK"

            echo ""
            echo "index.html:"
            ls -lh "$CURRENT_LINK/index.html"

            echo ""
            echo "=========================================="
            echo "Deployment successful"
            echo "=========================================="