<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 850" width="500" height="850">
  <defs>
    <linearGradient id="phoneFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="screenBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="40%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <filter id="phoneGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- External Glow Aura -->
  <rect x="35" y="35" width="430" height="780" rx="55" fill="#8B5CF6" opacity="0.3" filter="url(#phoneGlow)"/>

  <!-- Phone Frame Border -->
  <rect x="30" y="30" width="440" height="790" rx="52" fill="none" stroke="url(#phoneFrame)" stroke-width="6" filter="url(#badgeGlow)"/>
  <rect x="36" y="36" width="428" height="778" rx="46" fill="#0B0F19"/>

  <!-- Screen Content Area -->
  <g transform="translate(45, 45)">
    <!-- Inner Screen Background -->
    <rect width="410" height="760" rx="38" fill="url(#screenBg)"/>

    <!-- Top Status Bar & Notch -->
    <path d="M130 0 H280 C280 0 270 20 250 20 H160 C140 20 130 0 130 0 Z" fill="#090D16"/>
    <text x="35" y="25" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#FFFFFF">9:41</text>
    <text x="375" y="25" font-family="sans-serif" font-size="12" fill="#FFFFFF">📶 🔋</text>

    <!-- Top Host Header Info Overlay -->
    <g transform="translate(15, 45)">
      <rect width="180" height="46" rx="23" fill="#000000" fill-opacity="0.5" stroke="#FFFFFF" stroke-opacity="0.2"/>
      <circle cx="23" cy="23" r="18" fill="#EC4899"/>
      <text x="23" y="29" font-family="sans-serif" font-size="18" text-anchor="middle">👸</text>
      <text x="48" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#FFFFFF">Aria_Live ✨</text>
      <text x="48" y="35" font-family="'Inter', sans-serif" font-weight="600" font-size="10" fill="#F472B6">❤️ 128.4K Likes</text>

      <rect x="190" y="5" width="70" height="36" rx="18" fill="#EC4899"/>
      <text x="225" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" text-anchor="middle">+ Follow</text>
      
      <rect x="270" y="5" width="120" height="36" rx="18" fill="#000000" fill-opacity="0.5"/>
      <circle cx="285" cy="23" r="12" fill="#3B82F6"/>
      <circle cx="305" cy="23" r="12" fill="#10B981"/>
      <circle cx="325" cy="23" r="12" fill="#F59E0B"/>
      <text x="365" y="27" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" text-anchor="middle">3.4k</text>
    </g>

    <!-- Center Host Video Visual Graphic -->
    <g transform="translate(0, 105)">
      <!-- Animated Live Spotlight Background -->
      <circle cx="205" cy="200" r="150" fill="#8B5CF6" opacity="0.2" filter="url(#phoneGlow)"/>
      <circle cx="205" cy="180" r="90" fill="#F472B6" opacity="0.25" filter="url(#phoneGlow)"/>
      
      <!-- Host Graphic Artwork -->
      <circle cx="205" cy="180" r="75" fill="#311042" stroke="#F472B6" stroke-width="4" filter="url(#badgeGlow)"/>
      <text x="205" y="200" font-family="sans-serif" font-size="75" text-anchor="middle">🎤💃</text>

      <!-- PK Progress Bar Overlay -->
      <g transform="translate(20, 310)">
        <rect width="370" height="24" rx="12" fill="#1E293B"/>
        <rect width="230" height="24" rx="12" fill="url(#phoneFrame)"/>
        <text x="15" y="17" font-family="'Inter', sans-serif" font-weight="900" font-size="11" fill="#FFFFFF">PK 45,200 pts</text>
        <text x="355" y="17" font-family="'Inter', sans-serif" font-weight="900" font-size="11" fill="#94A3B8" text-anchor="end">28,100 pts</text>
      </g>
    </g>

    <!-- Floating Luxury Gift Popup (3D Rocket / Sports Car Gift Animation Mockup) -->
    <g transform="translate(30, 465)" filter="url(#badgeGlow)">
      <rect width="350" height="70" rx="20" fill="#000000" fill-opacity="0.75" stroke="#F59E0B" stroke-width="2"/>
      <circle cx="40" cy="35" r="24" fill="#F59E0B"/>
      <text x="40" y="44" font-family="sans-serif" font-size="28" text-anchor="middle">🚀</text>
      <text x="75" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#FBBF24">Alex_VIP sent Super Rocket!</text>
      <text x="75" y="52" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#E2E8F0">Gift Value: 9,999 Coins 💎</text>
      <text x="320" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="24" fill="#F59E0B">x5</text>
    </g>

    <!-- Stream Chat Messages Overlay -->
    <g transform="translate(20, 550)">
      <!-- Msg 1 -->
      <rect y="0" width="240" height="32" rx="16" fill="#000000" fill-opacity="0.4"/>
      <text x="12" y="21" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#38BDF8">John_99: <tspan font-weight="400" fill="#FFFFFF">Amazing voice! 🔥</tspan></text>

      <!-- Msg 2 -->
      <rect y="38" width="280" height="32" rx="16" fill="#000000" fill-opacity="0.4"/>
      <text x="12" y="59" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#F472B6">Sara_Queen: <tspan font-weight="400" fill="#FFFFFF">Singing PK Battle winner!! 👑❤️</tspan></text>

      <!-- Msg 3 -->
      <rect y="76" width="220" height="32" rx="16" fill="#000000" fill-opacity="0.4"/>
      <text x="12" y="97" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#34D399">AgencyAdmin: <tspan font-weight="400" fill="#FFFFFF">Welcome new viewers!</tspan></text>
    </g>

    <!-- Bottom Action Toolbar -->
    <g transform="translate(20, 690)">
      <rect x="0" y="0" width="180" height="44" rx="22" fill="#000000" fill-opacity="0.5" stroke="#FFFFFF" stroke-opacity="0.2"/>
      <text x="18" y="27" font-family="'Inter', sans-serif" font-size="13" fill="#94A3B8">Say something...</text>

      <circle cx="210" cy="22" r="22" fill="#EC4899" filter="url(#badgeGlow)"/>
      <text x="210" y="29" font-family="sans-serif" font-size="20" text-anchor="middle">🎁</text>

      <circle cx="265" cy="22" r="22" fill="#3B82F6"/>
      <text x="265" y="29" font-family="sans-serif" font-size="20" text-anchor="middle">⭐</text>

      <circle cx="320" cy="22" r="22" fill="#EF4444" filter="url(#badgeGlow)"/>
      <text x="320" y="29" font-family="sans-serif" font-size="20" text-anchor="middle">💖</text>
      
      <circle cx="368" cy="22" r="18" fill="#10B981"/>
      <text x="368" y="28" font-family="sans-serif" font-size="16" text-anchor="middle">↗️</text>
    </g>
  </g>
</svg>
