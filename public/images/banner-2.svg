<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <linearGradient id="cyanBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="500" rx="24" fill="url(#bgGrad2)"/>
  
  <circle cx="250" cy="380" r="180" fill="#3B82F6" opacity="0.25" filter="url(#glow2)"/>
  <circle cx="950" cy="150" r="160" fill="#F59E0B" opacity="0.25" filter="url(#glow2)"/>

  <!-- Badge -->
  <rect x="80" y="70" width="230" height="36" rx="18" fill="#3B82F6" opacity="0.2"/>
  <rect x="80" y="70" width="230" height="36" rx="18" fill="none" stroke="#3B82F6" stroke-width="2"/>
  <text x="195" y="93" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="14" fill="#60A5FA" text-anchor="middle" letter-spacing="2">💼 AGENCY RECRUITMENT</text>

  <!-- Title -->
  <text x="80" y="170" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF">BECOME A VERIFIED</text>
  <text x="80" y="235" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="56" fill="url(#goldGrad)" filter="url(#glow2)">AGENCY PARTNER 👑</text>

  <!-- Benefits text -->
  <text x="80" y="290" font-family="'Inter', Arial, sans-serif" font-weight="500" font-size="20" fill="#E2E8F0">Build your streaming network. High commission rates, dedicated support &amp; fast payouts.</text>

  <!-- Button -->
  <g transform="translate(80, 330)">
    <rect width="260" height="60" rx="30" fill="url(#cyanBtn)" filter="url(#glow2)"/>
    <text x="130" y="36" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" text-anchor="middle">APPLY AS AGENCY →</text>
  </g>

  <!-- Right Visual Graphics: Agency Stats & Dashboard Card -->
  <g transform="translate(750, 100)">
    <rect x="0" y="0" width="360" height="280" rx="24" fill="#1E293B" opacity="0.9" stroke="#60A5FA" stroke-width="2" filter="url(#glow2)"/>
    
    <text x="30" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#FFFFFF">Agency Dashboard</text>
    <rect x="250" y="25" width="80" height="26" rx="13" fill="#10B981" opacity="0.2"/>
    <text x="290" y="42" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#34D399" text-anchor="middle">Active</text>

    <!-- Monthly Revenue -->
    <rect x="30" y="75" width="300" height="75" rx="16" fill="#0F172A"/>
    <text x="50" y="105" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#9CA3AF">Monthly Agency Revenue</text>
    <text x="50" y="135" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="26" fill="#FBBF24">$48,250.00 🚀</text>

    <!-- Hosts & Commission metrics -->
    <g transform="translate(30, 170)">
      <rect x="0" y="0" width="140" height="75" rx="14" fill="#0F172A"/>
      <text x="15" y="30" font-family="'Inter', sans-serif" font-size="12" fill="#9CA3AF">Active Hosts</text>
      <text x="15" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="22" fill="#60A5FA">142 Streamers</text>

      <rect x="160" y="0" width="140" height="75" rx="14" fill="#0F172A"/>
      <text x="175" y="30" font-family="'Inter', sans-serif" font-size="12" fill="#9CA3AF">Payout Speed</text>
      <text x="175" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="22" fill="#34D399">24 Hours ⚡</text>
    </g>
  </g>
</svg>
