<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 110" width="450" height="110">
  <defs>
    <!-- Gradients -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F3E8FF"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="liveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F87171"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Glow Aura -->
  <circle cx="55" cy="55" r="40" fill="#8B5CF6" opacity="0.25" filter="url(#iconGlow)"/>

  <!-- Logo Icon Container (rounded hexagon/shield) -->
  <rect x="15" y="15" width="80" height="80" rx="24" fill="url(#logoGrad)" filter="url(#iconGlow)"/>
  
  <!-- Inner Glass Overlay -->
  <rect x="18" y="18" width="74" height="74" rx="21" fill="#FFFFFF" fill-opacity="0.12"/>
  
  <!-- Play & Stream Camera Icon Symbol -->
  <path d="M42 35 C42 32.5 45 31 47.2 32.4 L72.2 47.4 C74.2 48.6 74.2 51.4 72.2 52.6 L47.2 67.6 C45 69 42 67.5 42 65 Z" fill="#FFFFFF"/>
  <circle cx="68" cy="38" r="6" fill="#06B6D4"/>
  <circle cx="70" cy="72" r="5" fill="#EC4899"/>

  <!-- Live Pulse Pill -->
  <g transform="translate(112, 22)">
    <rect x="0" y="0" width="62" height="22" rx="11" fill="url(#liveGrad)" filter="url(#dotGlow)"/>
    <circle cx="12" cy="11" r="4" fill="#FFFFFF"/>
    <text x="22" y="15" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" letter-spacing="1">LIVE</text>
  </g>

  <!-- Typography: Qobo1Live -->
  <text x="112" y="74" font-family="'Plus Jakarta Sans', 'Inter', Arial, sans-serif" font-weight="900" font-size="40" fill="url(#textGrad)" letter-spacing="-1">Qobo<tspan fill="#EC4899">1</tspan><tspan fill="#06B6D4">Live</tspan></text>
  
  <!-- Subtitle Tagline -->
  <text x="114" y="94" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="11" fill="#9CA3AF" letter-spacing="3.5">STREAM • PARTY • EARN</text>
</svg>
