<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="50%" stop-color="#701A75"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="500" rx="24" fill="url(#bgGrad3)"/>
  
  <circle cx="300" cy="200" r="170" fill="#A855F7" opacity="0.3" filter="url(#glow3)"/>
  <circle cx="900" cy="300" r="160" fill="#F59E0B" opacity="0.35" filter="url(#glow3)"/>

  <!-- Badge -->
  <rect x="80" y="70" width="220" height="36" rx="18" fill="#F59E0B" opacity="0.25"/>
  <rect x="80" y="70" width="220" height="36" rx="18" fill="none" stroke="#FBBF24" stroke-width="2"/>
  <text x="190" y="93" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="14" fill="#FDE047" text-anchor="middle" letter-spacing="2">🎁 SPECIAL PROMOTION</text>

  <!-- Title -->
  <text x="80" y="170" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF">FIRST RECHARGE OFFER</text>
  <text x="80" y="235" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="56" fill="url(#coinGrad)" filter="url(#glow3)">GET 100% EXTRA COINS! 💰</text>

  <!-- Subtitle -->
  <text x="80" y="290" font-family="'Inter', Arial, sans-serif" font-weight="500" font-size="20" fill="#F3E8FF">Double your coins on your first top-up. Send luxury gifts &amp; unlock VIP badges instantly!</text>

  <!-- Button -->
  <g transform="translate(80, 330)">
    <rect width="240" height="60" rx="30" fill="url(#coinGrad)" filter="url(#glow3)"/>
    <text x="120" y="36" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="18" fill="#1E1B4B" text-anchor="middle">RECHARGE NOW 🔥</text>
  </g>

  <!-- Right Visual Graphics: Coin Chest & VIP Badge -->
  <g transform="translate(750, 80)">
    <circle cx="200" cy="170" r="130" fill="#FBBF24" opacity="0.2" filter="url(#glow3)"/>
    <polygon points="200,40 240,110 320,120 260,170 280,250 200,210 120,250 140,170 80,120 160,110" fill="url(#coinGrad)" filter="url(#glow3)"/>
    <circle cx="200" cy="140" r="50" fill="#FFFFFF" opacity="0.9"/>
    <text x="200" y="155" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="44" fill="#D97706" text-anchor="middle">x2</text>
    <rect x="90" y="270" width="220" height="40" rx="20" fill="#1E1B4B" stroke="#FBBF24" stroke-width="2"/>
    <text x="200" y="295" font-family="'Inter', sans-serif" font-weight="800" font-size="16" fill="#FDE047" text-anchor="middle">VIP LEVEL 1 UNLOCKED</text>
  </g>
</svg>
