<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="40%" stop-color="#311042"/>
      <stop offset="80%" stop-color="#701A75"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
    <linearGradient id="vsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" rx="24" fill="url(#bgGrad1)"/>
  
  <!-- Cyber Patterns / Grid Background -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200 M0 300 H1200 M0 350 H1200 M0 400 H1200 M0 450 H1200"/>
    <path d="M100 0 V500 M200 0 V500 M300 0 V500 M400 0 V500 M500 0 V500 M600 0 V500 M700 0 V500 M800 0 V500 M900 0 V500 M1000 0 V500 M1100 0 V500"/>
  </g>

  <!-- Light Glowing Orbs -->
  <circle cx="200" cy="150" r="140" fill="#8B5CF6" opacity="0.3" filter="url(#glow)"/>
  <circle cx="1000" cy="350" r="160" fill="#EC4899" opacity="0.3" filter="url(#glow)"/>
  <circle cx="600" cy="250" r="100" fill="#F59E0B" opacity="0.25" filter="url(#glow)"/>

  <!-- Badge Tag -->
  <rect x="80" y="70" width="180" height="36" rx="18" fill="#F59E0B" opacity="0.2"/>
  <rect x="80" y="70" width="180" height="36" rx="18" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <text x="170" y="93" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="14" fill="#FBBF24" text-anchor="middle" letter-spacing="2">🔥 SEASON 4 PK</text>

  <!-- Main Headline -->
  <text x="80" y="170" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF">MEGA PK BATTLE</text>
  <text x="80" y="235" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="56" fill="url(#vsGrad)" filter="url(#glow)">CHAMPIONSHIP 2026</text>
  
  <!-- Subtitle -->
  <text x="80" y="290" font-family="'Inter', Arial, sans-serif" font-weight="500" font-size="20" fill="#E2E8F0">Host vs Host Real-Time Battle. Top Winner Takes <tspan font-weight="800" fill="#FBBF24">$10,000 Coins!</tspan></text>

  <!-- CTA Button Graphic -->
  <g transform="translate(80, 330)">
    <rect width="240" height="60" rx="30" fill="url(#btnGrad)" filter="url(#glow)"/>
    <text x="120" y="36" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" text-anchor="middle">JOIN BATTLE NOW →</text>
  </g>

  <!-- Right Visual Graphics - Host vs Host Arena Mockup -->
  <g transform="translate(720, 80)">
    <!-- Host 1 Card -->
    <rect x="0" y="40" width="180" height="280" rx="20" fill="#1E293B" stroke="#06B6D4" stroke-width="3" filter="url(#glow)"/>
    <circle cx="90" cy="130" r="45" fill="#38BDF8"/>
    <text x="90" y="138" font-family="sans-serif" font-size="36" text-anchor="middle">🎤</text>
    <rect x="25" y="200" width="130" height="24" rx="12" fill="#06B6D4"/>
    <text x="90" y="216" font-family="'Inter', sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" text-anchor="middle">TEAM RED 👑</text>
    <text x="90" y="255" font-family="'Inter', sans-serif" font-weight="900" font-size="22" fill="#38BDF8" text-anchor="middle">85,400 pts</text>

    <!-- VS Shield Central Glow -->
    <circle cx="210" cy="180" r="42" fill="url(#vsGrad)" filter="url(#glow)"/>
    <text x="210" y="192" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="32" fill="#FFFFFF" text-anchor="middle">VS</text>

    <!-- Host 2 Card -->
    <rect x="240" y="40" width="180" height="280" rx="20" fill="#1E293B" stroke="#EC4899" stroke-width="3" filter="url(#glow)"/>
    <circle cx="330" cy="130" r="45" fill="#F472B6"/>
    <text x="330" y="138" font-family="sans-serif" font-size="36" text-anchor="middle">💃</text>
    <rect x="265" y="200" width="130" height="24" rx="12" fill="#EC4899"/>
    <text x="330" y="216" font-family="'Inter', sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" text-anchor="middle">TEAM BLUE ⚡</text>
    <text x="330" y="255" font-family="'Inter', sans-serif" font-weight="900" font-size="22" fill="#F472B6" text-anchor="middle">92,100 pts</text>
  </g>
</svg>
