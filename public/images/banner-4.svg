<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="500" rx="24" fill="url(#bgGrad4)"/>
  
  <circle cx="200" cy="300" r="160" fill="#34D399" opacity="0.25" filter="url(#glow4)"/>
  <circle cx="950" cy="180" r="170" fill="#38BDF8" opacity="0.25" filter="url(#glow4)"/>

  <!-- Badge -->
  <rect x="80" y="70" width="220" height="36" rx="18" fill="#34D399" opacity="0.2"/>
  <rect x="80" y="70" width="220" height="36" rx="18" fill="none" stroke="#34D399" stroke-width="2"/>
  <text x="190" y="93" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="14" fill="#6EE7B7" text-anchor="middle" letter-spacing="2">🎙️ VOICE PARTY ROOMS</text>

  <!-- Title -->
  <text x="80" y="170" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF">9-SEAT AUDIO CHAT &amp;</text>
  <text x="80" y="235" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="56" fill="url(#cyanGrad)" filter="url(#glow4)">MUSIC VOICE PARTY 🎵</text>

  <!-- Subtitle -->
  <text x="80" y="290" font-family="'Inter', Arial, sans-serif" font-weight="500" font-size="20" fill="#CCFBF1">Gather with friends, sing karaoke, play sound effects &amp; host audio live shows 24/7!</text>

  <!-- Button -->
  <g transform="translate(80, 330)">
    <rect width="250" height="60" rx="30" fill="url(#cyanGrad)" filter="url(#glow4)"/>
    <text x="125" y="36" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="18" fill="#064E3B" text-anchor="middle">ENTER ROOM NOW 🎧</text>
  </g>

  <!-- Right Visual Graphics: 9-Seat Voice Grid Layout -->
  <g transform="translate(750, 75)">
    <rect x="0" y="0" width="350" height="330" rx="24" fill="#064E3B" opacity="0.8" stroke="#34D399" stroke-width="2" filter="url(#glow4)"/>
    
    <text x="30" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#FFFFFF">🎤 Late Night Lounge #108</text>
    <rect x="250" y="22" width="70" height="24" rx="12" fill="#10B981"/>
    <text x="285" y="38" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" text-anchor="middle">9/9 Seats</text>

    <!-- 3x3 Seats Grid -->
    <g transform="translate(30, 60)">
      <!-- Row 1 -->
      <circle cx="45" cy="40" r="28" fill="#34D399"/>
      <text x="45" y="47" font-family="sans-serif" font-size="22" text-anchor="middle">👑</text>
      <circle cx="145" cy="40" r="28" fill="#10B981"/>
      <text x="145" y="47" font-family="sans-serif" font-size="22" text-anchor="middle">🎤</text>
      <circle cx="245" cy="40" r="28" fill="#3B82F6"/>
      <text x="245" y="47" font-family="sans-serif" font-size="22" text-anchor="middle">🎧</text>

      <!-- Row 2 -->
      <circle cx="45" cy="130" r="28" fill="#EC4899"/>
      <text x="45" y="137" font-family="sans-serif" font-size="22" text-anchor="middle">🎸</text>
      <circle cx="145" cy="130" r="28" fill="#F59E0B"/>
      <text x="145" y="137" font-family="sans-serif" font-size="22" text-anchor="middle">🌟</text>
      <circle cx="245" cy="130" r="28" fill="#8B5CF6"/>
      <text x="245" y="137" font-family="sans-serif" font-size="22" text-anchor="middle">💎</text>

      <!-- Row 3 -->
      <circle cx="45" cy="220" r="28" fill="#06B6D4"/>
      <text x="45" y="227" font-family="sans-serif" font-size="22" text-anchor="middle">🔥</text>
      <circle cx="145" cy="220" r="28" fill="#F43F5E"/>
      <text x="145" y="227" font-family="sans-serif" font-size="22" text-anchor="middle">💖</text>
      <circle cx="245" cy="220" r="28" fill="#10B981"/>
      <text x="245" y="227" font-family="sans-serif" font-size="22" text-anchor="middle">🎁</text>
    </g>
  </g>
</svg>
